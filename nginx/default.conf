# Upstream definition for n8n service
upstream n8n_backend {
    server n8n:5678;
}

# WebSocket connection upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ==============================================================================
# HTTP Server (Port 80)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost; # Replace with your domain name (e.g., n8n.yourdomain.com)

    # Max upload size for workflows, credentials, or file uploads
    client_max_body_size 50M;

    # Logger configurations
    access_log /var/log/nginx/n8n.access.log;
    error_log /var/log/nginx/n8n.error.log warn;

    # --- RHEL PRODUCTION SSL REDIRECT (Comment out the location block below and uncomment this to force HTTPS) ---
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # --- LOCAL DEVELOPMENT PROXY (Default active for local HTTP access) ---
    location / {
        proxy_pass http://n8n_backend;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (Required for n8n UI updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Disable buffering for Server-Sent Events (SSE) to prevent lag in n8n UI
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        
        # Timeouts for persistent websocket connections
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}

